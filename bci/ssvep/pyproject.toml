[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads1299-ssvep"
version = "0.1.0"
description = "SSVEP BCI algorithms for ADS1299-Core-SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ads1299_ssvep*"]
