[platformio]
src_dir = examples/stm32cube_reference

[env:nucleo_h743zi2_ads1299]
platform = ststm32
board = nucleo_h743zi
framework = stm32cube
lib_deps =
    file://../../../core_driver/ads1299
    file://ads1299_port
    file://stm32cube_adapter
build_flags =
    -D USE_HAL_DRIVER
    -D STM32H743xx
    -Wall
    -Wextra
    -Werror
