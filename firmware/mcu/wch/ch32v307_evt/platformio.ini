[platformio]
default_envs = ch32v307_evt

[env:ch32v307_evt]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#499971abbee9d191c43132770be02fabfbf572cd
board = ch32v307_evt
framework = noneos-sdk
monitor_speed = 921600
lib_ldf_mode = deep+
lib_extra_dirs =
    ../../../core_driver
    ../../../common
build_flags =
    -Iinclude
    -DADS1299_REFERENCE_PROJECT=1
    -Wall
    -Wextra
