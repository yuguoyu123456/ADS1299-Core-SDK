name: esp32-reference

on:
  push:
    branches: [ main, production-sdk-v1, repo-architecture-v1 ]
  pull_request:

jobs:
  esp32-host-queues:
    name: host-queue-${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: esp32
            test_dir: firmware/mcu/02_Espressif/ESP32/tests
          - model: esp32-c2
            test_dir: firmware/mcu/02_Espressif/ESP32-C2/tests
          - model: esp32-c3
            test_dir: firmware/mcu/02_Espressif/ESP32-C3/tests
          - model: esp32-c5
            test_dir: firmware/mcu/02_Espressif/ESP32-C5/tests
          - model: esp32-c6
            test_dir: firmware/mcu/02_Espressif/ESP32C6/tests
          - model: esp32-h2
            test_dir: firmware/mcu/02_Espressif/ESP32-H2/tests
          - model: esp32-p4
            test_dir: firmware/mcu/02_Espressif/ESP32-P4/tests
          - model: esp32-s3
            test_dir: firmware/mcu/02_Espressif/ESP32S3/tests
    steps:
      - uses: actions/checkout@v4
      - name: Build and run bounded-queue regression
        working-directory: ${{ matrix.test_dir }}
        run: |
          make -f Makefile.host clean
          make -f Makefile.host test

  esp32s3-idf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate rank-3 structure
        run: python tests/validate_esp32s3.py
      - name: Build ESP32-S3 native ESP-IDF project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.0
          target: esp32s3
          path: firmware/mcu/02_Espressif/ESP32S3
