name: gd32-reference

on:
  push:
    paths:
      - 'firmware/mcu/gigadevice/gd32f450z_eval/**'
      - 'firmware/core_driver/ads1299/**'
      - 'firmware/common/data_packet/**'
      - 'firmware/mcu/common/reference_app/**'
      - '.github/workflows/gd32-reference.yml'
  pull_request:
    paths:
      - 'firmware/mcu/gigadevice/gd32f450z_eval/**'
      - 'firmware/core_driver/ads1299/**'
      - 'firmware/common/data_packet/**'
      - 'firmware/mcu/common/reference_app/**'
      - '.github/workflows/gd32-reference.yml'

jobs:
  gd32f450-platformio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Clean build GD32F450Z-EVAL reference
        run: pio run -d firmware/mcu/gigadevice/gd32f450z_eval -e gd32f450z_eval
