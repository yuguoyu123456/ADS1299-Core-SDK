name: core-ci

on:
  push:
    branches: [ main, production-sdk-v1, repo-architecture-v1 ]
  pull_request:

jobs:
  c-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ADS1299 core tests
        run: |
          core_sources="firmware/core_driver/ads1299/ads1299.c firmware/core_driver/ads1299/ads1299_frame.c firmware/core_driver/ads1299/ads1299_model.c firmware/core_driver/ads1299/ads1299_multi.c"
          for test_source in tests/c/test_ads1299*.c; do
            case "$test_source" in
              tests/c/test_ads1299_packet.c|tests/c/test_ads1299_transport.c) continue ;;
            esac
            test_name="$(basename "$test_source" .c)"
            gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/core_driver/ads1299 \
              $core_sources "$test_source" -o "/tmp/$test_name"
            "/tmp/$test_name"
          done
      - name: Build host packet golden-vector test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/common/data_packet \
            firmware/common/data_packet/ads1299_packet.c \
            tests/c/test_ads1299_packet.c \
            -o /tmp/test_ads1299_packet
      - name: Run host packet golden-vector test
        run: /tmp/test_ads1299_packet
      - name: Build and run transport contract test
        run: |
          python tests/validate_transport_layer.py
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/common/data_packet -Ifirmware/transport \
            firmware/common/data_packet/ads1299_packet.c \
            firmware/transport/ads1299_transport.c \
            tests/c/test_ads1299_transport.c \
            -o /tmp/test_ads1299_transport
          /tmp/test_ads1299_transport
      - name: Compile every standardized MCU port package
        run: |
          python tests/validate_mcu_catalog.py
          python tests/validate_stm32h743.py
          python tests/validate_stm32f407.py
          python tests/validate_esp32s3.py
          python tests/validate_mimxrt1170.py
          python tests/validate_mimxrt1062.py
          python tests/validate_mspm0g3507.py
          python tests/validate_ecosystem_100.py
          find firmware/mcu -type d -name ads1299_port -print0 | while IFS= read -r -d '' port_dir; do
            target_dir="$(dirname "$port_dir")"
            for source in "$port_dir"/*.c "$target_dir"/tests/*.c; do
              case "$source" in
                */01_STMicroelectronics/STM32C031/tests/*.c)
                  # STM32C031 owns a linked host integration suite. Its tests share
                  # example queue and common packet dependencies, so keep the suite
                  # atomic instead of recompiling individual test translation units
                  # with the generic dependency-free include set.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32c031_frame_queue.c"
                  test -f "$target_dir/examples/stm32c031_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32c031_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32c031_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F091/tests/*.c)
                  # STM32F091 owns a linked host integration suite. Its small-MCU
                  # frame queue and canonical packet tests depend on leaf/shared
                  # sources, so keep the whole suite atomic rather than compiling
                  # individual members with the generic dependency-free include set.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f091_frame_queue.c"
                  test -f "$target_dir/examples/stm32f091_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f091_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f091_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F103/tests/*.c)
                  # STM32F103 owns a linked host integration suite. Its bounded F1
                  # frame queue and canonical packet tests require leaf/shared
                  # sources, so preserve the complete suite as one validation unit.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f103_frame_queue.c"
                  test -f "$target_dir/examples/stm32f103_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f103_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f103_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F303/tests/*.c)
                  # STM32F303 owns a linked host integration suite. Its bounded frame
                  # queue and canonical packet tests require leaf/shared sources, so
                  # preserve the complete suite as one host-validation boundary.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f303_frame_queue.c"
                  test -f "$target_dir/examples/stm32f303_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f303_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f303_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F407/tests/*.c)
                  # STM32F407 owns a linked host integration suite. It supplies the
                  # example queue plus common data-packet include/link dependencies;
                  # run that complete suite once and do not reclassify its members as
                  # standalone dependency-free host translation units afterwards.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f407_frame_queue.c"
                  test -f "$target_dir/examples/stm32f407_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f407_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f407_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F429/tests/*.c)
                  # STM32F429 owns a linked host integration suite. Its bounded frame
                  # queue and canonical packet tests require leaf/shared sources, so
                  # preserve the complete suite as one host-validation boundary.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f429_frame_queue.c"
                  test -f "$target_dir/examples/stm32f429_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f429_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f429_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F446/tests/*.c)
                  # STM32F446 owns a linked host integration suite. Its frame queue
                  # and packet tests require the leaf example/common packet sources,
                  # so run the complete suite once rather than compiling members with
                  # the generic dependency-free include set.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f446_frame_queue.c"
                  test -f "$target_dir/examples/stm32f446_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f446_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f446_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32F767/tests/*.c)
                  # STM32F767 owns a linked host integration suite. Its high-throughput
                  # bounded queue and canonical packet tests depend on leaf/shared
                  # sources, so validate the complete suite atomically rather than
                  # recompiling its members as dependency-free translation units.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32f767_frame_queue.c"
                  test -f "$target_dir/examples/stm32f767_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32f767_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32f767_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32G071/tests/*.c)
                  # STM32G071 also owns a linked host integration suite. Its frame
                  # queue test depends on the example queue implementation and its
                  # packet test depends on the shared packet module, so preserve the
                  # complete leaf suite as one atomic host-validation boundary.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32g071_frame_queue.c"
                  test -f "$target_dir/examples/stm32g071_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32g071_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32g071_host_suite_done
                  fi
                  continue
                  ;;
                */01_STMicroelectronics/STM32G4/tests/*.c)
                  # STM32G4 owns a linked host integration suite. Its bounded frame
                  # queue and canonical packet tests depend on leaf/shared sources,
                  # so execute the full suite once instead of misclassifying members
                  # as standalone dependency-free translation units.
                  test -f "$target_dir/tests/Makefile.host"
                  test -f "$target_dir/examples/stm32g4_frame_queue.c"
                  test -f "$target_dir/examples/stm32g4_frame_queue.h"
                  if [ ! -e /tmp/ads1299_stm32g4_host_suite_done ]; then
                    (cd "$target_dir/tests" && make -f Makefile.host clean test clean)
                    touch /tmp/ads1299_stm32g4_host_suite_done
                  fi
                  continue
                  ;;
                */03_NXP/LPC55S69/tests/test_adapter.c|*/03_NXP/LPC55S69/tests/test_vendor_spi.c)
                  # These tests intentionally consume genuine NXP MCUXpresso SDK
                  # headers and, for test_vendor_spi.c, the real fsl_spi.c driver.
                  # Keep them under their dedicated ARM/Unicorn runners instead of
                  # pretending they are dependency-free portable-host units.
                  test -f "$target_dir/tests/run_adapter_tests.py"
                  test -f "$target_dir/tests/run_vendor_tests.py"
                  test -f "$target_dir/tests/compile_adapter.py"
                  test -f "$target_dir/mcux_adapter/ads1299_lpc55_hal.c"
                  test -f "$target_dir/mcux_adapter/ads1299_lpc55_hal.h"
                  continue
                  ;;
                */05_Renesas/RA6M5/tests/test_fsp_adapter.c)
                  # This test intentionally consumes official Renesas FSP API headers.
                  # Preserve it under its dedicated ARM/Unicorn runner instead of
                  # pretending it is a dependency-free portable-host translation unit.
                  test -f "$target_dir/tests/run_adapter_tests.py"
                  test -f "$target_dir/fsp_adapter/ads1299_fsp_hal.c"
                  test -f "$target_dir/fsp_adapter/ads1299_fsp_hal.h"
                  continue
                  ;;
                */06_Microchip/SAME54/tests/test_polling.c)
                  # This MMIO polling test intentionally consumes official Harmony/DFP
                  # register definitions. Keep it under the dedicated ARM/Unicorn
                  # runner and require both real-header compile paths to remain present.
                  test -f "$target_dir/tests/run_polling_tests.py"
                  test -f "$target_dir/tests/compile_adapter.py"
                  test -f "$target_dir/harmony_adapter/ads1299_same54_hal.c"
                  test -f "$target_dir/harmony_adapter/ads1299_same54_hal.h"
                  continue
                  ;;
              esac
              gcc -std=c11 -Wall -Wextra -Werror \
                -Ifirmware/core_driver/ads1299 -I"$port_dir" \
                -c "$source" -o /tmp/ads1299_port_check.o
            done
          done

  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install algorithm dependencies
        run: pip install -r eeg_analysis/python/requirements.txt
      - name: Run PC packet golden-vector tests
        run: python tests/python/test_packet.py
      - name: Run EEG beginner demo
        run: python eeg_analysis/python/demo_basic_analysis.py
      - name: Run SSVEP baseline demo
        run: python bci/ssvep/cca_baseline.py
      - name: Run CSP baseline demo
        run: python bci/motor_imagery/csp_baseline.py
      - name: Run extended BCI smoke tests
        run: python tests/python/test_bci_extended.py

  fpga-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Validate FPGA package structure
        run: python tests/validate_fpga_ecosystem.py
      - name: Compile and run all FPGA reference testbenches
        run: |
          find firmware/fpga -name project.json -print0 | while IFS= read -r -d '' manifest; do
            package="$(dirname "$manifest")"
            name="$(basename "$package")"
            iverilog -g2012 -o "/tmp/$name" \
              "$package/rtl/ads1299_spi_master.v" \
              "$package/rtl/ads1299_controller.v" \
              "$package/rtl/frame_parser.v" \
              "$package/tb/simulation_tb.v"
            vvp "/tmp/$name"
