name: core-ci

on:
  push:
    branches: [ main, production-sdk-v1, repo-architecture-v1 ]
  pull_request:

jobs:
  c-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C core test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/core_driver/ads1299 \
            firmware/core_driver/ads1299/ads1299.c \
            firmware/core_driver/ads1299/ads1299_bringup.c \
            firmware/core_driver/ads1299/ads1299_control.c \
            firmware/core_driver/ads1299/ads1299_field_model.c \
            firmware/core_driver/ads1299/ads1299_frame.c \
            firmware/core_driver/ads1299/ads1299_register_model.c \
            firmware/core_driver/ads1299/ads1299_runtime.c \
            tests/c/test_ads1299.c \
            -o /tmp/test_ads1299
      - name: Run C core test
        run: /tmp/test_ads1299
      - name: Build ADS1299 register-model test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/core_driver/ads1299 \
            firmware/core_driver/ads1299/ads1299_register_model.c \
            tests/c/test_ads1299_register_model.c \
            -o /tmp/test_ads1299_register_model
      - name: Run ADS1299 register-model test
        run: /tmp/test_ads1299_register_model
      - name: Build ADS1299 field-model test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/core_driver/ads1299 \
            firmware/core_driver/ads1299/ads1299.c \
            firmware/core_driver/ads1299/ads1299_field_model.c \
            firmware/core_driver/ads1299/ads1299_register_model.c \
            firmware/core_driver/ads1299/ads1299_runtime.c \
            tests/c/test_ads1299_field_model.c \
            -o /tmp/test_ads1299_field_model
      - name: Run ADS1299 field-model test
        run: /tmp/test_ads1299_field_model
      - name: Build ADS1299 runtime-control test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/core_driver/ads1299 \
            firmware/core_driver/ads1299/ads1299.c \
            firmware/core_driver/ads1299/ads1299_bringup.c \
            firmware/core_driver/ads1299/ads1299_control.c \
            firmware/core_driver/ads1299/ads1299_field_model.c \
            firmware/core_driver/ads1299/ads1299_register_model.c \
            firmware/core_driver/ads1299/ads1299_runtime.c \
            tests/c/test_ads1299_runtime.c \
            -o /tmp/test_ads1299_runtime
      - name: Run ADS1299 runtime-control test
        run: /tmp/test_ads1299_runtime
      - name: Build ADS1299 variant frame/status test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/core_driver/ads1299 \
            firmware/core_driver/ads1299/ads1299.c \
            firmware/core_driver/ads1299/ads1299_frame.c \
            firmware/core_driver/ads1299/ads1299_register_model.c \
            tests/c/test_ads1299_frame.c \
            -o /tmp/test_ads1299_frame
      - name: Run ADS1299 variant frame/status test
        run: /tmp/test_ads1299_frame

  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install algorithm dependencies
        run: pip install -r eeg_analysis/python/requirements.txt
      - name: Run PC packet round-trip
        run: python tests/python/test_packet.py
      - name: Run EEG beginner demo
        run: python eeg_analysis/python/demo_basic_analysis.py
      - name: Run SSVEP baseline demo
        run: python bci/ssvep/cca_baseline.py
      - name: Run CSP baseline demo
        run: python bci/motor_imagery/csp_baseline.py
      - name: Run extended BCI smoke tests
        run: python tests/python/test_bci_extended.py

  fpga-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and run frame-unpack testbench
        run: |
          iverilog -g2012 -o /tmp/tb_unpack firmware/fpga/rtl/ads1299_frame_unpack.v firmware/fpga/tb/tb_ads1299_frame_unpack.v
          vvp /tmp/tb_unpack
