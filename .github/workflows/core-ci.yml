name: core-ci

on:
  push:
    branches: [ main, bootstrap-v0.1, phase-a-platforms, eeg-bci-toolkit-v0.2, core-bringup-v0.2 ]
  pull_request:

jobs:
  c-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C core test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Idrivers/ads1299 \
            drivers/ads1299/ads1299.c \
            drivers/ads1299/ads1299_bringup.c \
            tests/c/test_ads1299.c \
            -o /tmp/test_ads1299
      - name: Run C core test
        run: /tmp/test_ads1299

  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install algorithm dependencies
        run: pip install -r algorithms/python/requirements.txt
      - name: Run host packet round-trip
        run: python tests/python/test_packet.py
      - name: Run EEG beginner demo
        run: python algorithms/python/demo_basic_analysis.py
      - name: Run SSVEP baseline demo
        run: python bci/ssvep/cca_baseline.py
      - name: Run CSP baseline demo
        run: python bci/motor_imagery/csp_baseline.py
      - name: Run extended BCI smoke tests
        run: python tests/python/test_bci_extended.py

  fpga-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and run frame-unpack testbench
        run: |
          iverilog -g2012 -o /tmp/tb_unpack fpga/rtl/ads1299_frame_unpack.v fpga/tb/tb_ads1299_frame_unpack.v
          vvp /tmp/tb_unpack
