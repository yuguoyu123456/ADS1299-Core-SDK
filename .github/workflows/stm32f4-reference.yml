name: stm32f4-reference

on:
  push:
    branches: [ main, production-sdk-v1, repo-architecture-v1 ]
  pull_request:

jobs:
  stm32f407g-disc1-cube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO Core
        run: pip install platformio==6.1.19
      - name: Validate rank-2 package boundary
        run: python tests/validate_stm32f407.py
      - name: Build ADS1299 STM32CubeF4 reference
        run: platformio run -d firmware/mcu/01_STMicroelectronics/STM32F407
