name: rk3576-linux

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/linux_compute/Rockchip/RK3576/**'
      - 'firmware/core_driver/ads1299/**'
      - '.github/workflows/rk3576-linux.yml'
  pull_request:
    paths:
      - 'firmware/linux_compute/Rockchip/RK3576/**'
      - 'firmware/core_driver/ads1299/**'
      - '.github/workflows/rk3576-linux.yml'

jobs:
  host-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile RK3576 Linux userspace probe against shared core
        run: |
          make -C firmware/linux_compute/Rockchip/RK3576 clean check
