name: eeg-analysis-ci

on:
  push:
    branches: [ main, eeg-analysis-production-v1 ]
    paths:
      - 'eeg_analysis/**'
      - 'tests/python/test_eeg_package.py'
      - '.github/workflows/eeg-analysis-ci.yml'
  pull_request:
    paths:
      - 'eeg_analysis/**'
      - 'tests/python/test_eeg_package.py'
      - '.github/workflows/eeg-analysis-ci.yml'

jobs:
  python-eeg-package:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: eeg_analysis/python/pyproject.toml
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install ADS1299 EEG package
        run: python -m pip install -e eeg_analysis/python
      - name: Compile Python package
        run: python -m compileall -q eeg_analysis/python/ads1299_eeg
      - name: Run numerical EEG regression tests
        run: python tests/python/test_eeg_package.py
      - name: Run legacy beginner demo for compatibility
        run: python eeg_analysis/python/demo_basic_analysis.py
