name: r-eeg-ci

on:
  pull_request:
    paths:
      - 'eeg_analysis/r/**'
      - '.github/workflows/r-eeg-ci.yml'
  push:
    branches: [main]
    paths:
      - 'eeg_analysis/r/**'
      - '.github/workflows/r-eeg-ci.yml'

jobs:
  r-eeg-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.3', 'release']

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install ads1299eeg package
        run: R CMD INSTALL eeg_analysis/r/ads1299eeg

      - name: Run numerical EEG regression tests
        run: Rscript -e "library(ads1299eeg); source('eeg_analysis/r/ads1299eeg/tests/run_tests.R')"

      - name: Check legacy beginner entry point parses
        run: Rscript -e "source('eeg_analysis/r/eeg_basic_analysis.R'); stopifnot(is.function(ads1299_eeg_basic))"
